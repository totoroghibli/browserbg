<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Ẩn thanh cuộn */
            background-color: #000;
        }
  
        .bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Giúp video luôn lấp đầy màn hình mà không bị co giãn/méo tỉ lệ */
            object-position: center;
            /* Căn giữa video */
            display: block;
        }
    </style>
</head>

<body>

    <!-- Thay đường dẫn video của bạn vào thuộc tính src -->
    <!-- <video class="bg-video" autoplay loop muted playsinline>
        <source src="5.gif" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ thẻ video.
    </video> -->
    <img src="5.gif" class="bg-video" alt="Background GIF">
</body>

</html>
